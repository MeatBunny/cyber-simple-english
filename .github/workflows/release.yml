name: release
# A pushed version tag (v1.2.3) creates the GitHub release. The notes are the
# CHANGELOG entry of that version. The attached zip holds only the skill folder,
# for a manual install.
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip="cyber-simple-english-skill-$version.zip"
          git archive --format=zip -o "$zip" --prefix=cyber-simple-english/ "HEAD:skills/cyber-simple-english"
          awk -v v="$version" '/^## /{on = index($0, "## " v ",") == 1; next} on' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" "$zip" --verify-tag --title "Cyber Simple English $version" --notes-file notes.md
